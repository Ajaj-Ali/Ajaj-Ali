<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Ajaj Ali — Applied AI Engineer</title>
  <desc id="desc">Dark futuristic banner featuring GenAI, Agentic AI, Voice AI and RAG, with speech waveforms, AI nodes and technology labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071326"/><stop offset=".55" stop-color="#101b3c"/><stop offset="1" stop-color="#160f31"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#48e5f4"/><stop offset="1" stop-color="#8b8cff"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#142944" stop-opacity=".9"/><stop offset="1" stop-color="#111b35" stop-opacity=".9"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#6a91c4" stroke-opacity=".08" stroke-width="1"/></pattern>
  </defs>
  <rect width="1500" height="500" rx="26" fill="url(#bg)"/>
  <rect width="1500" height="500" rx="26" fill="url(#grid)"/>
  <circle cx="170" cy="160" r="190" fill="#00c9e8" opacity=".07"/>
  <circle cx="1290" cy="300" r="230" fill="#8b5cf6" opacity=".09"/>
  <path d="M35 415 C270 350 390 480 620 390 S1000 330 1465 410" fill="none" stroke="url(#cyan)" stroke-opacity=".24" stroke-width="2"/>

  <!-- left profile / audio emblem -->
  <g transform="translate(82 100)">
    <rect x="0" y="0" width="188" height="188" rx="34" fill="#0b1c32" stroke="#35d9ed" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="94" cy="67" r="34" fill="none" stroke="url(#cyan)" stroke-width="5"/>
    <path d="M42 143 Q48 105 94 105 Q140 105 146 143" fill="none" stroke="url(#cyan)" stroke-width="6" stroke-linecap="round"/>
    <path d="M22 92h13l8-18 12 38 12-27 10 15h12l8-23 10 30 10-17h16" fill="none" stroke="#57e9f5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity=".9"/>
  </g>
  <text x="82" y="326" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="3" fill="#9eb8d8">BUILDING WITH</text>
  <text x="82" y="356" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#e9f7ff">INTELLIGENCE <tspan fill="#5be2f2">+</tspan> IMPACT</text>

  <!-- main title -->
  <text x="320" y="125" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="800" fill="#f5f8ff">Ajaj Ali <tspan fill="#59e4f3">&lt;/&gt;</tspan></text>
  <text x="322" y="174" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" letter-spacing="1.2" fill="url(#cyan)">APPLIED AI ENGINEER</text>
  <text x="322" y="214" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#c5d4ee">GenAI  •  Agentic AI  •  Voice AI  •  RAG</text>
  <text x="322" y="252" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#8fa8cc">Building intelligent systems for a smarter tomorrow</text>

  <!-- capability cards -->
  <g transform="translate(320 286)">
    <rect width="250" height="84" rx="15" fill="url(#panel)" stroke="#3bcfe5" stroke-opacity=".45"/>
    <text x="18" y="30" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#64e5f1">VOICE AI</text>
    <text x="18" y="55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#c4d6ef">Streaming S2S · STT · TTS</text>
  </g>
  <g transform="translate(585 286)">
    <rect width="250" height="84" rx="15" fill="url(#panel)" stroke="#8c82ff" stroke-opacity=".5"/>
    <text x="18" y="30" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#a9a2ff">GENAI &amp; RAG</text>
    <text x="18" y="55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#c4d6ef">Knowledge · Retrieval · LLMs</text>
  </g>
  <g transform="translate(850 286)">
    <rect width="250" height="84" rx="15" fill="url(#panel)" stroke="#3bcfe5" stroke-opacity=".45"/>
    <text x="18" y="30" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#64e5f1">AGENTIC SYSTEMS</text>
    <text x="18" y="55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#c4d6ef">Tools · Workflows · Scale</text>
  </g>

  <!-- right-side neural / robot motif -->
  <g transform="translate(1190 80)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 78 L78 36 L140 75 L112 142 L45 145 Z" fill="none" stroke="#6d7cff" stroke-opacity=".45" stroke-width="2"/>
    <path d="M78 36V-4 M20 78L-12 48 M140 75L173 43 M112 142L151 177 M45 145L18 181" stroke="#51dff0" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="78" cy="36" r="7" fill="#70eaf4" filter="url(#glow)"/><circle cx="20" cy="78" r="5" fill="#8b8cff"/><circle cx="140" cy="75" r="6" fill="#8b8cff"/><circle cx="112" cy="142" r="5" fill="#70eaf4"/><circle cx="45" cy="145" r="6" fill="#70eaf4"/>
    <rect x="48" y="62" width="62" height="64" rx="16" fill="#122b48" stroke="url(#cyan)" stroke-width="2.5"/>
    <rect x="60" y="77" width="38" height="20" rx="7" fill="#081426" stroke="#55dff0" stroke-width="1.5/>
    <circle cx="70" cy="87" r="3" fill="#63e9f3"/><circle cx="88" cy="87" r="3" fill="#a69aff"/>
    <path d="M66 108h26 M79 62V49" stroke="#65e5f3" stroke-width="2.5"/>
  </g>
  <text x="1190" y="295" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#9db6d8">INNOVATE</text>
  <text x="1190" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#9db6d8">AUTOMATE</text>
  <text x="1190" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#9db6d8">SCALE</text>

  <!-- tech footer -->
  <line x1="320" y1="400" x2="1418" y2="400" stroke="#7594c7" stroke-opacity=".25"/>
  <text x="320" y="438" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#8ea8ce" letter-spacing="1.5">PYTHON</text>
  <text x="430" y="438" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#8ea8ce" letter-spacing="1.5">PYTORCH</text>
  <text x="555" y="438" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#8ea8ce" letter-spacing="1.5">LANGGRAPH</text>
  <text x="690" y="438" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#8ea8ce" letter-spacing="1.5">OPENAI</text>
  <text x="800" y="438" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#8ea8ce" letter-spacing="1.5">HUGGING FACE</text>
  <text x="960" y="438" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#8ea8ce" letter-spacing="1.5">DOCKER</text>
  <text x="1070" y="438" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#8ea8ce" letter-spacing="1.5">KUBERNETES</text>
  <text x="1250" y="438" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#8ea8ce" letter-spacing="1.5">AWS · GCP</text>
</svg>
